<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">📝 Simple Blog</div>
            <ul class="nav-links">
                <li><a href="#" onclick="showSection('posts')" class="active">Posts</a></li>
                <li><a href="#" onclick="showSection('users')">Users</a></li>
                <li><a href="#" onclick="showSection('stats')">Statistics</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Posts Section -->
        <section id="posts-section" class="section active">
            <div class="section-header">
                <h2>Blog Posts</h2>
                <button class="btn btn-primary" onclick="showPostForm()">+ New Post</button>
            </div>
            
            <!-- Post Form Modal -->
            <div id="post-form-modal" class="modal hidden">
                <div class="modal-content">
                    <span class="close" onclick="hidePostForm()">&times;</span>
                    <h3 id="post-form-title">Create New Post</h3>
                    <form id="post-form" onsubmit="savePost(event)">
                        <input type="hidden" id="post-id">
                        <div class="form-group">
                            <label for="post-title-input">Title</label>
                            <input type="text" id="post-title-input" required placeholder="Enter post title">
                        </div>
                        <div class="form-group">
                            <label for="post-content-input">Content</label>
                            <textarea id="post-content-input" required placeholder="Write your post content here..." rows="6"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="post-author-select">Author</label>
                            <select id="post-author-select" required>
                                <option value="">Select an author</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hidePostForm()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Post</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Post Detail Modal -->
            <div id="post-detail-modal" class="modal hidden">
                <div class="modal-content modal-large">
                    <span class="close" onclick="hidePostDetail()">&times;</span>
                    <div id="post-detail-content"></div>
                </div>
            </div>

            <div id="posts-list" class="cards-container">
                <!-- Posts will be loaded here -->
            </div>
        </section>

        <!-- Users Section -->
        <section id="users-section" class="section hidden">
            <div class="section-header">
                <h2>Users</h2>
                <button class="btn btn-primary" onclick="showUserForm()">+ New User</button>
            </div>
            
            <!-- User Form Modal -->
            <div id="user-form-modal" class="modal hidden">
                <div class="modal-content">
                    <span class="close" onclick="hideUserForm()">&times;</span>
                    <h3>Create New User</h3>
                    <form id="user-form" onsubmit="saveUser(event)">
                        <div class="form-group">
                            <label for="username-input">Username</label>
                            <input type="text" id="username-input" required placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label for="email-input">Email</label>
                            <input type="email" id="email-input" required placeholder="Enter email">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="hideUserForm()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create User</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- User Detail Modal -->
            <div id="user-detail-modal" class="modal hidden">
                <div class="modal-content">
                    <span class="close" onclick="hideUserDetail()">&times;</span>
                    <div id="user-detail-content"></div>
                </div>
            </div>

            <div id="users-list" class="cards-container">
                <!-- Users will be loaded here -->
            </div>
        </section>

        <!-- Statistics Section -->
        <section id="stats-section" class="section hidden">
            <div class="section-header">
                <h2>Statistics</h2>
                <button class="btn btn-secondary" onclick="loadStats()">🔄 Refresh</button>
            </div>
            <div id="stats-container">
                <!-- Statistics will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Web Blog - Demo Application</p>
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
