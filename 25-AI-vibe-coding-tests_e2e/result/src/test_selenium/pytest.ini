[pytest]
# Configuration pytest pour les tests Selenium
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés
markers =
    users: Tests de la suite Users
    posts: Tests de la suite Posts
    statistics: Tests de la suite Statistics
    haute: Tests de priorité haute
    moyenne: Tests de priorité moyenne
    basse: Tests de priorité basse

# Options par défaut
addopts = -v --tb=short

# Timeout par défaut (nécessite pytest-timeout)
# timeout = 60

# Ignorer les warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
