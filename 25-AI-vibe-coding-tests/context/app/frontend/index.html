<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Blog API - Interface Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 SQAAILab</h1>
            <p class="subtitle">Flask Blog API - Complete Admin Interface</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showSection('stats')">📊 Statistics</button>
            <button class="tab" onclick="showSection('users')">👥 Users</button>
            <button class="tab" onclick="showSection('posts')">📝 Posts</button>
        </div>

        <div class="content">
            <!-- STATISTIQUES -->
            <div id="stats" class="section active">
                <h2>📊 Global Statistics</h2>
                <div class="stats-grid" id="statsContainer">
                    <div class="loading">Loading statistics...</div>
                </div>
                <button class="btn btn-primary" onclick="loadStats()" style="margin-top: 20px;">🔄 Refresh</button>
            </div>

            <!-- UTILISATEURS -->
            <div id="users" class="section">
                <h2>👥 User Management</h2>
                <div class="message" id="userMessage"></div>
                
                <div class="card">
                    <div class="card-header">➕ Create User</div>
                    <form onsubmit="createUser(event)">
                        <div class="two-column">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" id="username" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">📋 User List</div>
                    <div id="usersList"></div>
                    <button class="btn btn-info" onclick="loadUsers()">🔄 Refresh List</button>
                </div>
            </div>

            <!-- POSTS -->
            <div id="posts" class="section">
                <h2>📝 Post Management</h2>
                <div class="message" id="postMessage"></div>
                
                <div class="card">
                    <div class="card-header">➕ Create Post</div>
                    <form onsubmit="createPost(event)">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="postTitle" required>
                        </div>
                        <div class="form-group">
                            <label>Content</label>
                            <textarea id="postContent" required></textarea>
                        </div>
                        <div class="two-column">
                            <div class="form-group">
                                <label>Author (User ID)</label>
                                <select id="postUserId" required></select>
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select id="postPublished">
                                    <option value="false">Draft</option>
                                    <option value="true">Published</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Create Post</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">📋 Post List</div>
                    <div id="postsList"></div>
                    <button class="btn btn-info" onclick="loadPosts()">🔄 Refresh List</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        console.log('Script loaded successfully');
        const API_URL = 'http://localhost:5000/api';

        // Navigation entre sections
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');

            // Charger les données au changement de section
            if (sectionId === 'stats') loadStats();
            if (sectionId === 'users') loadUsers();
            if (sectionId === 'posts') { loadPosts(); loadUsersForSelect(); }
        }

        // Afficher les messages
        function showMessage(type, message, elementId) {
            const msgEl = document.getElementById(elementId);
            msgEl.className = `message ${type}`;
            msgEl.textContent = message;
            msgEl.style.display = 'block';
            setTimeout(() => msgEl.style.display = 'none', 5000);
        }

        // ========== STATISTIQUES ==========
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const data = await res.json();
                
                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${data.total_users}</div>
                        <div class="stat-label">👥 Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.total_posts}</div>
                        <div class="stat-label">📝 Total Posts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.published_posts}</div>
                        <div class="stat-label">✅ Published Posts</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('statsContainer').innerHTML = `<div class="empty-state">❌ Loading error</div>`;
            }
        }

        // ========== UTILISATEURS ==========
        async function createUser(e) {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showMessage('success', '✅ User created successfully!', 'userMessage');
                    e.target.reset();
                    loadUsers();
                } else {
                    showMessage('error', '❌ ' + data.error, 'userMessage');
                }
            } catch (error) {
                showMessage('error', '❌ Network error', 'userMessage');
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/users`);
                const data = await res.json();
                
                const html = data.users.length === 0 
                    ? '<div class="empty-state">No users</div>'
                    : data.users.map(u => `
                        <div class="list-item">
                            <div class="item-info">
                                <strong>${u.username}</strong> - ${u.email}
                                <br><small>ID: ${u.id} | Created: ${new Date(u.created_at).toLocaleDateString()}</small>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="deleteUser(${u.id})">🗑️ Delete</button>
                            </div>
                        </div>
                    `).join('');
                
                document.getElementById('usersList').innerHTML = html;
            } catch (error) {
                document.getElementById('usersList').innerHTML = '<div class="empty-state">❌ Loading error</div>';
            }
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            try {
                await fetch(`${API_URL}/users/${id}`, {method: 'DELETE'});
                showMessage('success', '✅ User deleted', 'userMessage');
                loadUsers();
            } catch (error) {
                showMessage('error', '❌ Error', 'userMessage');
            }
        }

        async function loadUsersForSelect() {
            try {
                const res = await fetch(`${API_URL}/users`);
                const data = await res.json();
                
                if (data.users.length === 0) {
                    const emptyOption = "<option value='' disabled selected>No users - create one first</option>";
                    document.getElementById('postUserId').innerHTML = emptyOption;
                    console.warn('No users found');
                } else {
                    const options = data.users.map(u => `<option value="${u.id}">${u.username} (ID: ${u.id})</option>`).join('');
                    document.getElementById('postUserId').innerHTML = options;
                }
            } catch (error) {
                console.error('Error loading users:', error);
                const errorOption = "<option value='' disabled selected>Loading error</option>";
                document.getElementById('postUserId').innerHTML = errorOption;
                showMessage('error', 'Unable to load users. Check that the server is running.', 'postMessage');
            }
        }

        // ========== POSTS ==========
        async function createPost(e) {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        title: document.getElementById('postTitle').value,
                        content: document.getElementById('postContent').value,
                        user_id: parseInt(document.getElementById('postUserId').value),
                        published: document.getElementById('postPublished').value === 'true'
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showMessage('success', '✅ Post created successfully!', 'postMessage');
                    e.target.reset();
                    loadPosts();
                } else {
                    showMessage('error', '❌ ' + data.error, 'postMessage');
                }
            } catch (error) {
                showMessage('error', '❌ Network error', 'postMessage');
            }
        }

        async function loadPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`);
                const data = await res.json();
                
                const html = data.posts.length === 0 
                    ? '<div class="empty-state">No posts</div>'
                    : data.posts.map(p => `
                        <div class="list-item">
                            <div class="item-info">
                                <strong>${p.title}</strong>
                                <span class="badge ${p.published ? 'badge-success' : 'badge-secondary'}">
                                    ${p.published ? '✅ Published' : '📝 Draft'}
                                </span>
                                <br><small>By ${p.author} | ${new Date(p.created_at).toLocaleDateString()}</small>
                                <br><small>${p.content.substring(0, 100)}...</small>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="deletePost(${p.id})">🗑️</button>
                            </div>
                        </div>
                    `).join('');
                
                document.getElementById('postsList').innerHTML = html;
            } catch (error) {
                document.getElementById('postsList').innerHTML = '<div class="empty-state">❌ Loading error</div>';
            }
        }

        async function deletePost(id) {
            if (!confirm('Delete this post?')) return;
            try {
                await fetch(`${API_URL}/posts/${id}`, {method: 'DELETE'});
                showMessage('success', '✅ Post deleted', 'postMessage');
                loadPosts();
            } catch (error) {
                showMessage('error', '❌ Error', 'postMessage');
            }
        }

        // Load stats on startup
        loadStats();
    </script>
</body>
</html>
